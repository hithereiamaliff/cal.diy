name: Build TechMavie Booking API v2 image

# Cal API v2 (apps/api/v2) is a separate service from the web app. The Cal.com MCP
# (hithereiamaliff/mcp-calcom) needs it; see techmavie/API-V2.md for the VPS setup.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: techmavie-build-api-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cal.diy-api

jobs:
  build:
    # Only run in the TechMavie fork, never upstream
    if: github.repository_owner == 'hithereiamaliff'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: actions/checkout@v4

      # API v2 forces TLS on its Bull queue whenever NODE_ENV=production, which breaks a plain
      # Redis container. Make TLS opt-in (REDIS_TLS=true) inside the CI build only, like the
      # branding step: no upstream file is edited in git, and the build fails if the line changes.
      - name: Make Redis TLS opt-in for API v2
        run: |
          FILE=apps/api/v2/src/app.module.ts
          OLD='process.env.NODE_ENV === "production" ? "?tls=true" : ""'
          NEW='process.env.REDIS_TLS === "true" ? "?tls=true" : ""'
          if ! grep -qF "$OLD" "$FILE"; then
            echo "::error file=$FILE::The Redis TLS line changed upstream - update this patch step."
            exit 1
          fi
          python3 - "$FILE" "$OLD" "$NEW" <<'PY'
          import sys
          path, old, new = sys.argv[1:]
          with open(path, encoding="utf-8") as source:
              text = source.read()
          with open(path, "w", encoding="utf-8") as target:
              target.write(text.replace(old, new))
          PY
          grep -nF "$NEW" "$FILE"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=raw,value={{date 'YYYYMMDD-HHmm'}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/v2/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Placeholder only: Prisma generate needs a valid URL at build time. The real
          # database URL comes from /opt/calcom/.env at runtime and overrides this.
          build-args: |
            DATABASE_URL=postgresql://build:build@localhost:5432/build
            DATABASE_DIRECT_URL=postgresql://build:build@localhost:5432/build
          cache-from: type=gha,scope=api-v2
          cache-to: type=gha,mode=max,scope=api-v2
