name: Build TechMavie Booking image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: techmavie-build-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cal.diy

jobs:
  build:
    # Only run in the TechMavie fork, never upstream
    if: github.repository_owner == 'hithereiamaliff'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=raw,value={{date 'YYYYMMDD-HHmm'}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_WEBAPP_URL=https://book.techmavie.digital
            NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL=https://techmavie.digital/privacy-policy
            NEXT_PUBLIC_WEBSITE_TERMS_URL=https://techmavie.digital/privacy-policy
            CALCOM_TELEMETRY_DISABLED=1
            ORGANIZATIONS_ENABLED=false
            MAX_OLD_SPACE_SIZE=12288
          cache-from: type=gha
          cache-to: type=gha,mode=max
